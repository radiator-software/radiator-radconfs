AuthPort
AcctPort
<ServerDIAMETER>
    BindAddress 127.0.0.1
    Port 28682
    Protocol tcp
    OriginHost r4-collector.example
    OriginRealm example
    AuthApplicationIds 1
    AcctApplicationIds 1, 3
    Clients 127.0.0.1
</ServerDIAMETER>
<Handler>
    AcctLogFileName %L/collector-accounting.log
    <AuthBy RADIUS>
        Host 127.0.0.1
        AuthPort 18183
        AcctPort 18183
        Secret mysecret
        Retries 0
        RetryTimeout 2
    </AuthBy>
</Handler>
