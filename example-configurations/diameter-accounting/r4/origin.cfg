AuthPort
AcctPort 18182
BindAddress 127.0.0.1
<Client 127.0.0.1>
    Secret mysecret
</Client>
<Handler>
    AcctLogFileName %L/origin-accounting.log
    <AuthBy DIAMETER>
        Peer 127.0.0.1
        Port 28681
        Protocol tcp
        OriginHost r4-origin.example
        OriginRealm example
        DestinationRealm example
        AuthApplicationIds 1
        AcctApplicationIds 3
        ReconnectTimeout 1
    </AuthBy>
</Handler>
